name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go build ./...
      # Includes the recall gate: HNSW must reach >=0.9 recall@10 vs the
      # exact index, so graph-construction regressions fail here.
      - run: go test ./... -v
